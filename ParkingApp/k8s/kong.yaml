apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
data:
  kong.yml: |
    _format_version: "3.0"

    services:
      - name: usuarios-service
        url: http://ms-usuarios-roles-oauth:8082
        routes:
          - name: auth-route
            paths:
              - /api/auth
            strip_path: false
            plugins:
              - name: rate-limiting
                config:
                  minute: 60
                  policy: local
          - name: oauth-jwks-route
            paths:
              - /.well-known
            strip_path: false
          - name: usuarios-route
            paths:
              - /api/users
              - /api/roles
              - /api/tenants
            strip_path: false
            plugins:
              - name: jwt
                config:
                  claims_to_verify:
                    - exp

      - name: zonas-espacios-service
        url: http://ms-zonas-espacios:8081
        routes:
          - name: espacios-sse-route
            paths:
              - /api/espacios/sse
            strip_path: false
          - name: zonas-route
            paths:
              - /api/zonas
            strip_path: false
            plugins:
              - name: jwt
                config:
                  claims_to_verify:
                    - exp
          - name: espacios-route
            paths:
              - /api/espacios
            strip_path: false
            plugins:
              - name: jwt
                config:
                  claims_to_verify:
                    - exp

      - name: vehiculos-service
        url: http://ms-vehiculos:3000
        routes:
          - name: vehiculos-route
            paths:
              - /vehiculo
            strip_path: false
            plugins:
              - name: jwt
                config:
                  claims_to_verify:
                    - exp

      - name: tickets-service
        url: http://ms-tickets:3002
        routes:
          - name: tickets-route
            paths:
              - /tickets
            strip_path: false
            plugins:
              - name: jwt
                config:
                  claims_to_verify:
                    - exp

      - name: audit-service
        url: http://ms-audit:3001
        routes:
          - name: audit-route
            paths:
              - /audit
              - /api/audit
            strip_path: false
            plugins:
              - name: jwt
                config:
                  claims_to_verify:
                    - exp

    consumers:
      - username: oauth-issuer
        jwt_secrets:
          - key: http://ms-usuarios-roles-oauth:8082
            algorithm: RS256
            rsa_public_key: |
              -----BEGIN PUBLIC KEY-----
              MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAtmw0BlM9B3gSeTfqJHx+
              QijZSubfN4peLUv3YqyH4WJkDHw/XLdG4KoJZFzLjGZNPI/E/qeiK8qDm2FCHZZ5
              FTqT8yITjZElYXIwPAbD5BqPR6R+syxncd7woEnGBhTDhASMx9NSsvgVoyR8EE2X
              PfHcmNM7sMi9ARdwZxh24RJWUUuyUWtkk36fzXDG+MCf3yq/1b36usbz6EQ/d153
              1VMrArcI3XPe4+tAPgDK7aaILDQgvPUSj9dLRxuy3PP0eBFmF85ftA2Omrl/88kH
              1JdfaDkovnlfkduNJpwFi4Wp8pwrUxLUH59aUvkFLXwR9RNIqNAqFNkCiR7LBnlW
              LQIDAQAB
              -----END PUBLIC KEY-----

    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
            - X-Tenant-ID
          exposed_headers:
            - X-Total-Count
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 300
          policy: local
      - name: request-transformer
        config:
          add:
            headers:
              - X-Gateway:Kong
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
        - name: kong
          image: kong:3.4.0
          ports:
            - containerPort: 8000
            - containerPort: 8001
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /usr/local/kong/declarative/kong.yml
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:8001
          volumeMounts:
            - name: kong-config
              mountPath: /usr/local/kong/declarative
      volumes:
        - name: kong-config
          configMap:
            name: kong-declarative-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong
spec:
  type: NodePort
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
      nodePort: 30080
    - name: admin
      port: 8001
      targetPort: 8001
      nodePort: 30081
