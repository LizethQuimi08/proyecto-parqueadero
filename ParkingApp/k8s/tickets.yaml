apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-tickets
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-tickets
  template:
    metadata:
      labels:
        app: ms-tickets
    spec:
      containers:
        - name: ms-tickets
          image: parking/ms-tickets:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NOMBRE
              value: parking_db
            - name: DB_USUARIO
              valueFrom:
                secretKeyRef:
                  name: parking-secrets
                  key: POSTGRES_USER
            - name: DB_CONTRASENA
              valueFrom:
                secretKeyRef:
                  name: parking-secrets
                  key: POSTGRES_PASSWORD
            - name: MS_PERSONAS
              valueFrom:
                configMapKeyRef:
                  name: parking-config
                  key: MS_PERSONAS
            - name: MS_VEHICULOS
              valueFrom:
                configMapKeyRef:
                  name: parking-config
                  key: MS_VEHICULOS
            - name: MS_ZONAS
              valueFrom:
                configMapKeyRef:
                  name: parking-config
                  key: MS_ZONAS
            - name: JWKS_URI
              valueFrom:
                configMapKeyRef:
                  name: parking-config
                  key: JWKS_URI
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: parking-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: parking-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: parking-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: parking-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: parking-config
                  key: RABBITMQ_EXCHANGE
---
apiVersion: v1
kind: Service
metadata:
  name: ms-tickets
spec:
  selector:
    app: ms-tickets
  ports:
    - port: 3002
      targetPort: 3002
